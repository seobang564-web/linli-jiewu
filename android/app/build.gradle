import groovy.json.JsonOutput

plugins {
    id 'com.android.application'
}

def localConfig = new Properties()
def localConfigFile = rootProject.file('local.properties')
if (localConfigFile.exists()) {
    localConfigFile.withInputStream { localConfig.load(it) }
}

def serverBaseUrl = providers.gradleProperty('serverBaseUrl')
        .orElse(localConfig.getProperty('server.baseUrl', 'http://10.0.2.2:8080/api/')).get()
def mockLocation = localConfig.getProperty('debug.mockLocation', '').trim()
if (mockLocation && !(mockLocation ==~ /-?\d{1,2}(\.\d+)?,-?\d{1,3}(\.\d+)?/)) {
    throw new GradleException('debug.mockLocation 格式应为 纬度,经度，例如 30.5123456,114.4123456')
}
def serverUri = new URI(serverBaseUrl)
if (!(serverUri.scheme in ['http', 'https']) || !serverUri.host ||
        serverUri.userInfo || serverUri.query || serverUri.fragment || !serverBaseUrl.endsWith('/')) {
    throw new GradleException('server.baseUrl 必须是以 / 结尾的 HTTP(S) 地址，不得含凭据、查询或片段。')
}

android {
    namespace 'com.linlijiewu.app'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.linlijiewu.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        manifestPlaceholders = [AMAP_KEY: localConfig.getProperty('amap.key', '')]
        buildConfigField 'String', 'SERVER_BASE_URL', JsonOutput.toJson(serverBaseUrl)
        buildConfigField 'String', 'MOCK_LOCATION', '""'
    }

    signingConfigs {
        debug {
            storeFile rootProject.file('keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // 仅本机调试：local.properties 写 debug.mockLocation=纬度,经度（GCJ-02）后，
            // 发现页跳过高德定位、直接使用该坐标。未配置时走真实定位；release 永远不生效。
            buildConfigField 'String', 'MOCK_LOCATION', JsonOutput.toJson(mockLocation)
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    // 高德 3D 地图 + 定位 + 搜索合包（单独引入三个 SDK 会有类冲突）
    implementation 'com.amap.api:3dmap-location-search:11.3.100_loc11.3.101_sea9.8.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
